<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFAMS Planner</title><style>
:root{--blue:#2f3192;--red:#f20d0d;--green:#16a34a;--line:#e6eaf2;--ink:#172033;--muted:#667085;--bg:#f4f6fb;--card:#fff;--soft:#f8fafc;--shadow:0 12px 30px rgba(0,0,0,.08);--scale:1}body.dark{--bg:#0f172a;--card:#172033;--ink:#e5e7eb;--muted:#a8b3c7;--line:#334155;--soft:#111827;--shadow:0 12px 30px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif;font-size:calc(14px*var(--scale))}.wrap{max-width:1440px;margin:auto;padding:24px}.hero{display:grid;grid-template-columns:180px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;position:sticky;top:10px;z-index:10;box-shadow:var(--shadow)}.logo{width:170px;height:auto}h1{margin:0;color:var(--blue);font-size:calc(36px*var(--scale))}body.dark h1{color:#c7d2fe}.tabs,.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--ink)}.iconbtn{font-size:20px;line-height:1;padding:9px 12px}.primary{background:var(--blue);color:#fff;border:0}.tab.active[data-type=UAT]{background:var(--blue);color:#fff}.tab.active[data-type=EUT]{background:var(--red);color:#fff}.sep{color:var(--muted);font-weight:900;align-self:center}.banner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);margin:10px 0}.filters{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:10px}.control{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--card);color:var(--ink)}.legend,.statusKey{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.legend span{border-left:7px solid var(--vc);padding:6px 10px;border-radius:20px;background:var(--card);font-size:12px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.kpi small{display:block;color:var(--muted);font-weight:800}.kpi strong{font-size:calc(26px*var(--scale));color:var(--blue)}body.dark .kpi strong{color:#c7d2fe}.progressbar{height:10px;border-radius:999px;background:#edf0f7;overflow:hidden;margin-top:8px}body.dark .progressbar{background:#334155}.progressbar>i{display:block;height:100%;background:var(--green);width:0}.statusDot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25);vertical-align:middle;margin-right:5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.calendar.compact{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}.dow{font-size:12px;font-weight:900;color:var(--muted);padding:6px}.day{min-height:145px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px}.empty{opacity:.25}.date{font-weight:900}.chip{position:relative;border-left:6px solid var(--vc);background:var(--soft);border-radius:11px;padding:8px 8px 8px 12px;margin:7px 0;cursor:pointer}.sessionFlag{position:absolute;right:8px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--flag);border:1px solid rgba(0,0,0,.25)}.chip .t{font-size:12px;color:var(--muted);font-weight:900}.chip .m{font-size:13px;font-weight:900;padding-right:18px}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:190px 1fr 330px;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative}.datebox{border-radius:14px;background:#eef2ff;color:var(--blue);font-weight:900;text-align:center;padding:12px}.EUT .datebox{background:#fff1f1;color:var(--red)}body.dark .datebox{background:#1e293b;color:#c7d2fe}body.dark .EUT .datebox{background:#3b1f28;color:#fecaca}.pill{display:inline-block;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:800;padding:5px 9px;margin:4px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:rgba(10,15,35,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:var(--card);border-radius:22px;padding:22px;max-height:90vh;overflow:auto;width:min(1110px,96vw)}.detailgrid{display:grid;grid-template-columns:180px 1fr;gap:9px}.sectionbox{max-height:300px;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.scenarioTable{width:100%;border-collapse:collapse}.scenarioTable th,.scenarioTable td,table th,table td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}.useful-wrap{position:relative}.useful-menu{display:none;position:absolute;z-index:30;top:44px;left:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:280px;padding:8px}.useful-wrap.open .useful-menu{display:block}.useful-item{position:relative}.useful-item>a,.useful-parent{display:block;width:100%;padding:9px 12px;color:var(--ink);text-decoration:none;border-radius:8px;background:var(--card);border:0;text-align:left;font-weight:700}.submenu{display:none;position:absolute;left:100%;top:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:260px;padding:8px}.useful-item:hover>.submenu{display:block}.updated-note{text-align:center;color:var(--muted);font-size:13px;margin:24px 0}footer{text-align:center;margin:12px 0 24px;color:var(--muted)}footer a{color:var(--blue);font-weight:800}.printHeader,.printDoc{display:none}.sessionPrintLogo{text-align:center;margin-bottom:10px}.sessionPrintLogo img{width:25%;max-width:180px;height:auto}.printContent{zoom:70%}@media(max-width:1000px){.hero,.card{grid-template-columns:1fr}.filters,.kpis{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.submenu{position:static;display:block;box-shadow:none;margin-left:12px}}@media print{body{background:#fff;color:#000}.hero,.tabs,.filters,.kpis,.legend,.statusKey,footer,.modalback,.updated-note,.banner{display:none!important}.printHeader{display:block}.day,.card{break-inside:avoid;box-shadow:none}.day.empty{display:none}.print-session-mode #portal{display:none!important}.print-session-mode .printDoc{display:block!important}.printDoc h1{font-size:22px;color:#000}.printDoc table{border-collapse:collapse;width:100%;font-size:11px}.printDoc th,.printDoc td{border:1px solid #333;padding:6px}}
